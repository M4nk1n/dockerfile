name: Publish changed Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep pending pushes instead of replacing all but the last pending run.
concurrency:
  group: docker-publish-main
  queue: max

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
      commit: ${{ steps.changes.outputs.commit }}
    steps:
      # Read current main after entering the queue so delayed runs cannot publish old code.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Check selection and tag logic
        run: python3 -m unittest discover -s tests -v
      - name: Find affected projects
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          for commit in "$PUSH_BEFORE" "$PUSH_AFTER"; do
            if [ "$commit" != 0000000000000000000000000000000000000000 ] && ! git cat-file -e "$commit^{commit}"; then
              git fetch --no-tags origin "$commit"
            fi
          done
          projects=$(python3 scripts/ci.py changed "$PUSH_BEFORE" "$PUSH_AFTER")
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Affected projects: $projects" >> "$GITHUB_STEP_SUMMARY"
          echo "Build commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - name: Validate release tag and account
        id: tag
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set repository variable DOCKERHUB_USERNAME'; exit 1; }
          tag=$(python3 scripts/ci.py tag "packages/$PROJECT" "$(git rev-parse HEAD)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish both architectures
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash run.sh -d "$PROJECT" -a "$DOCKERHUB_USERNAME" -t "$RELEASE_TAG" \
            --platform linux/amd64,linux/arm64 -b -p
          docker buildx imagetools inspect --raw "$DOCKERHUB_USERNAME/$PROJECT:$RELEASE_TAG" \
            | python3 scripts/ci.py manifest
          echo "Published $DOCKERHUB_USERNAME/$PROJECT:$RELEASE_TAG and :latest" >> "$GITHUB_STEP_SUMMARY"
