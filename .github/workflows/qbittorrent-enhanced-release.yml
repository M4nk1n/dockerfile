name: Update qBittorrent Enhanced release

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  queue: max

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate update token
        env:
          UPDATE_TOKEN: ${{ secrets.CONTENTS_UPDATE_TOKEN }}
        run: test -n "$UPDATE_TOKEN" || { echo 'Set repository secret CONTENTS_UPDATE_TOKEN with Contents write access'; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.CONTENTS_UPDATE_TOKEN }}
      - name: Run self-checks
        run: python3 -m unittest discover -s tests -v
      - name: Check latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/c0re100/qBittorrent-Enhanced-Edition/releases/latest > "$RUNNER_TEMP/qbittorrent-release.json"
          python3 scripts/qbittorrent_release.py < "$RUNNER_TEMP/qbittorrent-release.json" >> "$GITHUB_OUTPUT"
      - name: Wait for matching LinuxServer base image
        if: steps.release.outputs.changed == 'true'
        run: |
          base_version=$(python3 scripts/ci.py qbittorrent-base-version packages/qbittorrent-enhanced)
          docker manifest inspect "linuxserver/qbittorrent:$base_version" >/dev/null
      - name: Commit version update and trigger existing publisher
        if: steps.release.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/qbittorrent-enhanced/version
          git commit -m "chore(qbittorrent-enhanced): update to $RELEASE_TAG"
          git push origin HEAD:main
          echo "Committed qBittorrent Enhanced $RELEASE_TAG; the push workflow handles image publishing." >> "$GITHUB_STEP_SUMMARY"
      - name: Report unchanged version
        if: steps.release.outputs.changed == 'false'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: echo "Already tracking $RELEASE_TAG; no commit needed." >> "$GITHUB_STEP_SUMMARY"
